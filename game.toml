[runtime]
debug_port = 4525
window_title = "MegaManX4Recomp"
memcard_dir = "saves"
# Title-owned resident ARC loading; drive and host timing stay authentic.
disc_speed        = "1x"
turbo_loads       = false
offer_turbo_loads = false
# HLE BIOS tier, DEFAULT-ON for X4 (mirrors X5/X6): kernel B0 event family served
# host-side + the boot shell-skip — boots straight past the PSX logo into the
# game (kernel init still runs the real recompiled BIOS; unimplemented services
# fall through to LLE). Set false (or PSX_BIOS_HLE=0) to compare against the
# authentic LLE boot.
bios_hle = true
# Keep the generic dirty-RAM native cache and interpreter fallback available.
# Original-disc inspection found no separate X4 game overlay; the ARC files
# inspected are assets. See docs/DISC_INVENTORY.md for evidence and limits.
# Priority: static > gcc shard > tcc shard > interp. Backend "auto" selects
# an available native toolchain. Captures are private diagnostic artifacts.
overlay_cache = true
overlay_backend = "auto"
# Compile RECIPE only (compiler + tool paths). The WRITE cache + READ captures are
# injected by the runtime (PSX_OVERLAY_CACHE_DIR / PSX_OVERLAY_CAPTURES) so they
# can never drift from the loader's canonical <exe>/cache + <exe>/overlay_captures.json.
overlay_autocompile_cmd = "py -3 psxrecomp-v4/tools/compile_overlays.py --game-toml game.toml --recompiler psxrecomp-v4/recompiler/build/psxrecomp-game.exe --runtime-include psxrecomp-v4/runtime/include --cps"

[audio]
# X4's normal production cadence does not need the framework's conservative
# 180 ms reserve. Keep 60 ms buffered to reduce audible input-to-sound delay;
# raise this toward 180 if a future path exposes crackle during long stalls.
buffer_ms = 60

[video]
# The default-on Custom Renderer follows the live drawable aspect.
aspect_ratio = "4:3"

# auto_skip_fmv: auto-skip full-motion videos (XA audio + MDEC). Off for the
# initial bring-up baseline; enabled during the enhancement-porting phase once the
# X4 MDEC player loop is understood (X4 ships STR/CAPCOM20.STR + per-stage OP/X/Z
# opening movies).
auto_skip_fmv = false
# Interpolation is archived and uncompiled for serial review.
frame_interpolation = false
offer_frame_interpolation = false

# Renderer default: OpenGL (hardware) — full-rate presentation on the current
# framework. The launcher's Renderer setting still offers Software.
renderer = "opengl"
internal_resolution = "1080p"
resolution_reference_lines = 240

# Modern authored-map renderer: the original21x16 tile ring stays unchanged.
[widescreen]
offer = false
full_2d = true
ultrawide = true
nw_left_hud_packet_lo = "0x80139800"
nw_left_hud_packet_hi = "0x8013a000"

# Primitive clipping is shared; actor bounds use original title callbacks.
[widescreen.cull]
auto_screen_x = true
screen_h_imms = ["0xf0"]

# The retired widescreen.bg2d producer/ring widening path is unavailable.
# The controller remains locked to the original digital protocol.
[controller]
default_mode   = "digital"
deadzone       = 6553
allow_hybrid   = false
lock_mode      = true

# ── Audit-specific config (consumed by psxrecomp tools/*.py and tests) ──
[audit]
# Dynamic discovery — functions are found by walking control flow from entry_pc.

# Code region: text segment is contiguous from load_address for text_size bytes.
[[audit.regions]]
name        = "Text"
rom_start   = "0x800"          # offset within the PS-X EXE file (skip header)
rom_end     = "0x120000"       # rom_start + text_size (0x800 + 0x11F800)
vaddr_base  = "0x80010000"

# Address normalization: KSEG masking only (game loads contiguously, no remaps).
[audit.normalize]
kseg_mask = "0x1FFFFFFF"

[timing]
# Double guest CPU budget during gameplay; device/VBlank/audio time stays authentic.
guest_cycle_scale = 2
guest_cycle_scale_gate = [{ addr = 0x801721C0, size = 1, value = 6 }]
