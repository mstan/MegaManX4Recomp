schema = 1

[product]
name = "MegaManX4Recomp"
display_name = "Mega Man X4 Recompiled"
exe_name = "MegaManX4Recomp"
version_file = "packaging/release/VERSION"
player_game_toml = "packaging/release/game.toml"
launcher_boxart = "recomp/launcher/boxart.tga"

[build]
regenerate = true
cmake_args = ["-DPSX_RECOMP_UI=ON", "-DPSX_ENABLE_VULKAN=OFF", "-DPSX_PGXP_VARIANT=OFF", "-DPSX_NETPLAY=ON", "-DMMX4_COOP_NETPLAY_DEBUG=OFF"]

[aot]
# Original-disc inventory found no separate executable overlay.
# The resident boot program is generated; runtime-discovered native
# code uses the bundled toolchain. No private cache is shipped.
mode = "none"
cps = false

[overlay_toolchain]
ship = true

# X4's existing mmx4.diagnostics has its own optional "inputs" feature.
# It is staged from the built catalog, not the shared recording/osd package.

[payload]
start_here = "packaging/release/START_HERE.txt"
files = [
  "LICENSE",
  "RELEASE_NOTES.md",
  "DISC.md",
  "tools/import_fmv_subtitles.py",
  "docs/LOCALIZATION.md",
  "docs/FMV_SUBTITLES.md",
  "docs/fmv-subtitles/CREDITS.md",
  "docs/fmv-subtitles/El-Retro-Dan-Final-LEEME.txt",
  "docs/fmv-subtitles/acediez-Undub-v1.13-Readme.txt",
  {from = "packaging/release/README.md", to = "README.md"},
  {from = "packaging/release/THIRD_PARTY_NOTICES.md", to = "THIRD_PARTY_NOTICES.md"},
  {from = "packaging/release/SOURCES.txt", to = "SOURCES.txt"},
  {from = "packaging/release/input.ini", to = "input.ini"},
  {from = "packaging/release/licenses/imgui-LICENSE.txt", to = "licenses/imgui-LICENSE.txt"},
  {from = "packaging/release/licenses/LatoLatin-OFL.txt", to = "licenses/LatoLatin-OFL.txt"},
  {from = "packaging/release/licenses/NotoSansSymbols2-OFL.txt", to = "licenses/NotoSansSymbols2-OFL.txt"},
  {from = "packaging/release/licenses/OpenMoji-LICENSE.txt", to = "licenses/OpenMoji-LICENSE.txt"},
  {from = "packaging/release/licenses/recomp-net-LICENSE.txt", to = "licenses/recomp-net-LICENSE.txt"},
  {from = "packaging/release/licenses/retcomm-rbengine-LICENSE.txt", to = "licenses/retcomm-rbengine-LICENSE.txt"},
  {from = "packaging/release/licenses/SDL3-LICENSE.txt", to = "licenses/SDL3-LICENSE.txt"},
]

[linux]
app_run = "packaging/linux/AppRun"
desktop_file = "packaging/linux/io.github.mstan.MegaManX4Recomp.desktop"
icon = "recomp/launcher/boxart.tga"
payload_dir = "megamanx4recomp"
env_prefix = "MMX4_RECOMP"
