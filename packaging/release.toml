schema = 1

[product]
name = "MegaManX4Recomp"
display_name = "Mega Man X4 Recompiled"
exe_name = "MegaManX4Recomp"
version_file = "packaging/release/VERSION"
player_game_toml = "packaging/release/game.toml"
launcher_boxart = "recomp/launcher/boxart.tga"

[build]
regenerate = true
cmake_args = ["-DPSX_RECOMP_UI=ON", "-DPSX_ENABLE_VULKAN=OFF", "-DPSX_PGXP_VARIANT=OFF", "-DPSX_NETPLAY=ON", "-DMMX4_COOP_NETPLAY_DEBUG=OFF"]

[aot]
# Original-disc inventory found no separate executable overlay.
# The resident boot program is generated; runtime-discovered native
# code uses the bundled toolchain. No private cache is shipped.
mode = "none"
cps = false

[overlay_toolchain]
ship = true

[diagnostics]
game_id = "SLUS-00561"
package_id = "mmx4.diagnostics"
replay_helper = false

[payload]
start_here = "packaging/release/START_HERE.txt"
files = [
  "README.md",
  "LICENSE",
  "RELEASE_NOTES.md",
  "THIRD_PARTY_NOTICES.md",
  "DISC.md",
  "tools/import_fmv_subtitles.py",
