[game]
name = "Mega Man X4"
id = "SLUS-00561"
exe = "mmx4/SLUS_005.61"
load_address = "0x80010000"
entry_pc = "0x800DAE8C"
text_size = "0x0011F800"
stack_base = "0x801FFFF0"

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
bios_config = "psxrecomp-v4/bios/SCPH1001.toml"

[runtime]
window_title = "Mega Man X4 Recompiled"
memcard_dir = "saves"
disc_speed = "1x"
turbo_loads = false
offer_turbo_loads = false
overlay_cache = true
overlay_backend = "auto"
bios_hle = true

# The developer config invokes Windows Python and MinGW by absolute path.
# A release config must not carry those paths into Linux, WSL, or Proton.
# This AppImage instead starts with matching native Linux shards bundled in
# cache/; unvisited overlays remain safely interpreted and captured.

[audio]
buffer_ms = 60

[video]
supersampling = 2
antialiasing = true
texture_filtering = "nearest"
renderer = "opengl"
auto_skip_fmv = false
offer_frame_interpolation = false
aspect_ratio = "4:3"

[controller]
default_mode = "digital"
deadzone = 6553
allow_hybrid = false
lock_mode = true

[widescreen]
offer = false
full_2d = true
nw_left_hud_packet_lo = "0x80139800"
nw_left_hud_packet_hi = "0x8013a000"

[widescreen.cull]
auto_screen_x = true
screen_h_imms = ["0xf0"]
bias_sites = [
  "0x8002b17c", "0x8002b1bc",
  "0x8002b2a8", "0x8002b2e8",
  "0x8002b3e0", "0x8002b420",
]
range_sites = [
  "0x8002b1c4",
  "0x8002b2f0",
  "0x8002b428",
]
a1_sites = [
  "0x8002b1ec",
  "0x8002b320",
]

[widescreen.bg2d]
count_site = "0x80026c98"
startcol_site = "0x80026b20"
startx_site = "0x80026b10"
stream_left_site = "0x800272d0"
stream_right_site = "0x800272e4"
layer_base = "0x801419b0"
ring_base = "0x801441c8"
map_size_addr = "0x80172224"
layer_stride_addr = "0x8013bd48"
ring_cols = 32
layer_count = 3
layer_struct_stride = 84
packet_cap = 1000
