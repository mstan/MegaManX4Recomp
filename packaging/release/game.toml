disc_speed = "1x"
turbo_loads = false
offer_turbo_loads = false
overlay_cache = true
overlay_backend = "auto"
bios_hle = true

# The developer config invokes Windows Python and MinGW by absolute path.
# A release config must not carry those paths into Linux, WSL, or Proton.
# Native caches remain supported. Original-disc inspection found no separate
# X4 game executable overlay; see docs/DISC_INVENTORY.md. Captured dirty RAM
# alone does not identify stage code or establish complete native coverage.

[audio]
buffer_ms = 60

[video]
frame_interpolation = false
internal_resolution = "1080p"
resolution_reference_lines = 240
antialiasing = true
texture_filtering = "nearest"
renderer = "opengl"
auto_skip_fmv = false
offer_frame_interpolation = false
aspect_ratio = "4:3"

[controller]
default_mode = "digital"
deadzone = 6553
allow_hybrid = false
lock_mode = true

# Modern authored-map renderer: the original21x16 tile ring stays unchanged.
[widescreen]
offer = false
full_2d = true
ultrawide = true
nw_left_hud_packet_lo = "0x80139800"
nw_left_hud_packet_hi = "0x8013a000"

# Primitive clipping is shared; actor bounds use original title callbacks.
[widescreen.cull]
auto_screen_x = true
screen_h_imms = ["0xf0"]

# The retired widescreen.bg2d producer/ring widening path is unavailable.
# The controller remains locked to the original digital protocol.

[timing]
# Double guest CPU budget during gameplay; device/VBlank/audio time stays authentic.
guest_cycle_scale = 2
guest_cycle_scale_gate = [{ addr = 0x801721C0, size = 1, value = 6 }]
