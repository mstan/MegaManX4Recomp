; PSX buttons are active when any listed SDL/Xbox-style source is pressed.
[controller]
enabled = true
device = 0
deadzone = 6553

[mapping]
up = dpup,lefty-
down = dpdown,lefty+
left = dpleft,leftx-
right = dpright,leftx+
cross = a
circle = b
square = x
triangle = y
l1 = leftshoulder
r1 = rightshoulder
l2 = lefttrigger
r2 = righttrigger
start = start
select = back
