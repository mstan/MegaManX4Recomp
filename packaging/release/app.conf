# Per-game identity for the title-neutral Linux release scripts.
APP_NAME="Mega Man X4 Recompiled"
EXE_NAME="MegaManX4Recomp"
PAYLOAD_DIR="megamanx4recomp"
DESKTOP_ID="io.github.mstan.MegaManX4Recomp"
ENV_PREFIX="MMX4_RECOMP"
ICON_SOURCE="recomp/launcher/boxart.tga"

# Manifests in the shipped Mods catalog, which the AppImage scripts count with
# `find <payload>/mods -name manifest.toml`. That is the WHOLE staged catalog,
# so it is this title's four game-owned packages (Fast Loading, Damage
# Multiplier, Widescreen, Frame Interpolation) PLUS the four the framework
# stages for every game (psx.enhancement.cd-speed / fast-loading / pgxp,
# psx.presentation.bezel) = 8.
#
# It said 4, which counted only this repo's half. That went stale the moment
# the framework gained its first builtin package, and the count is checked with
# -ne, so the AppImage packager was already failing before the mods/bundled
# work -- measured 8 in a real build output. A count that describes one side of
# a catalog two repositories contribute to cannot help but rot; the Windows
# packager no longer uses one (it asserts, via the framework's Add-ModCatalog,
# that every package the SOURCES define reached the staged catalog). Doing the
# same on the Linux side is worth a follow-up.
EXPECTED_MODS=8

# Regeneration currently emits 141 split translation units. Keeping this count
# explicit makes a partial generated/ checkout a hard packaging failure.
EXPECTED_STATIC_SHARDS=141
FRAMEWORK_DIR="psxrecomp-v4"
