author = "Yossef Khalil (https://github.com/YossefKhalil)"
description = "Silences the five streamed CD-XA music files, including title, menu, stage and boss music. Voices, cutscene audio and SFX are unchanged. The stock disc is never modified. Built with OpenCode (DeepSeek V4.1 Flash)."
