format_version = 11
id = "mmx4.coop4"
version = "0.0.1"
name = "Four Player Co-op"
author = "mstan"
description = "Experimental unique-hero roster with local split screen and independent online cameras. Requires OpenGL and a fresh boot."
resolver = "declarative"
channel = "experimental"
save_compatibility = "isolated"
disables = ["mmx4.coop", "mmx4.cheat.black-zero", "mmx4.cheat.ultimate-armor"]

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "coop"
name = "Four Player Co-op"
description = "Independent local split cameras or individual online views. Select a different form for each seat; only Player 4 can be None. Turns off two-player co-op and the separate Black Zero / Ultimate Armor code mods."
group = "Experimental"
default_enabled = false

[[plugin]]
feature = "coop"
id = "mmx4.coop4"

[[requirement]]
feature = "coop"
package = "mmx4.enhancement.widescreen"
requires_feature = "widescreen"

[[constraint]]
feature = "coop"
kind = "distinct_values"
options = ["p1", "p2", "p3", "p4"]

[[option]]
feature = "coop"
id = "p1"
label = "Player 1"
type = "choice"
default = "x"
[[option.choice]]
value = "x"
label = "X"
[[option.choice]]
value = "force_x"
label = "Fourth (Force) Armor X"
[[option.choice]]
value = "ultimate_x"
label = "Ultimate Armor X"
[[option.choice]]
value = "zero"
label = "Zero"
[[option.choice]]
value = "black_zero"
label = "Black Zero"

[[option]]
feature = "coop"
id = "p2"
label = "Player 2"
type = "choice"
default = "zero"
[[option.choice]]
value = "x"
label = "X"
[[option.choice]]
value = "force_x"
label = "Fourth (Force) Armor X"
[[option.choice]]
value = "ultimate_x"
label = "Ultimate Armor X"
[[option.choice]]
value = "zero"
label = "Zero"
[[option.choice]]
value = "black_zero"
label = "Black Zero"

[[option]]
feature = "coop"
id = "p3"
label = "Player 3"
type = "choice"
default = "ultimate_x"
[[option.choice]]
value = "x"
label = "X"
[[option.choice]]
value = "force_x"
label = "Fourth (Force) Armor X"
[[option.choice]]
value = "ultimate_x"
label = "Ultimate Armor X"
[[option.choice]]
value = "zero"
label = "Zero"
[[option.choice]]
value = "black_zero"
label = "Black Zero"

[[option]]
feature = "coop"
id = "p4"
label = "Player 4"
type = "choice"
default = "black_zero"
[[option.choice]]
value = "x"
label = "X"
[[option.choice]]
value = "force_x"
label = "Fourth (Force) Armor X"
[[option.choice]]
value = "ultimate_x"
label = "Ultimate Armor X"
[[option.choice]]
value = "zero"
label = "Zero"
[[option.choice]]
value = "black_zero"
label = "Black Zero"
[[option.choice]]
value = "none"
label = "None (three players)"

[[option]]
feature = "coop"
id = "cameras"
label = "Online cameras"
display_context = "online"
description = "Each player sees their own independent camera."
type = "choice"
default = "individual"
[[option.choice]]
value = "individual"
label = "Individual"

[[option]]
feature = "coop"
id = "local_cameras"
label = "Local cameras"
display_context = "offline"
description = "Four players use a 2x2 grid. With Player 4 set to None, Player 3 gets a 4:3 camera centered below Players 1 and 2, with black space on each side."
type = "choice"
default = "split"
[[option.choice]]
value = "split"
label = "Split screen"
