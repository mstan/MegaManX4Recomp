[[feature]]
id = "cast"
name = "Co-op Stage Select Cast"
description = "P1's hero and companion appear in front on both screens, with P2's behind. The partner cast stays visible and idle during dialogue; only the original speakers use dialogue animations. Requires a fresh boot. Online hosts use the equivalent experimental setting in the co-op lobby."
