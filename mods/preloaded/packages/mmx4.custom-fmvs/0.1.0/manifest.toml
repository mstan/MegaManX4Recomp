format_version = 14
id = "mmx4.custom-fmvs"
version = "0.1.0"
name = "Custom movies"
description = "Replace selected movies with your MP4s. Uses the original 320 x 240 player and native skip controls. Shorter clips with an audio track work best. Requires a compatible psxavenc helper installed separately."
resolver = "declarative"
prepare = "mmx4.custom-fmvs"
save_compatibility = "isolated"
conflicts = ["mmx4.japanese-fmvs"]

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "custom-fmvs"
name = "Custom movies"
group = "Enhancements"
channel = "experimental"
default_enabled = false
description = "Choose MP4 files with audio. Play prepares and caches them. Clear a file to use the original movie again."

[[plugin]]
feature = "custom-fmvs"
id = "mmx4.custom-fmvs"
order = -110

