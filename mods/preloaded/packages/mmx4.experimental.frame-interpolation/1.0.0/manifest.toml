format_version = 5
id = "mmx4.experimental.frame-interpolation"
version = "1.0.0"
name = "Mega Man X4 Frame Interpolation"
author = "mstan"
description = "Presentation-only temporal frame blending. Game logic, timers, and audio remain at their stock cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "frame-interpolation"
name = "Temporal Frame Blending (Experimental)"
description = "Blend completed game frames at the selected presentation rate without accelerating gameplay, timers, or audio. Requires OpenGL."
group = "Frame Rate"
default_enabled = false

[[option]]
feature = "frame-interpolation"
id = "rate"
label = "Presentation rate"
description = "Follow the display for even cadence, or choose a fixed diagnostic rate."
group = "Frame Rate"
type = "choice"
default = "display"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "display"
label = "Display refresh (Recommended)"

[[plugin]]
feature = "frame-interpolation"
id = "mmx4.framerate.60"
when = { rate = "60" }

[[plugin]]
feature = "frame-interpolation"
id = "mmx4.framerate.120"
when = { rate = "120" }

[[plugin]]
feature = "frame-interpolation"
id = "mmx4.framerate.144"
when = { rate = "144" }

[[plugin]]
feature = "frame-interpolation"
id = "mmx4.framerate.165"
when = { rate = "165" }

[[plugin]]
feature = "frame-interpolation"
id = "mmx4.framerate.display"
when = { rate = "display" }
