format_version = 5
id = "mmx4.enhancement.frame-interpolation"
version = "1.0.0"
name = "Mega Man X4 Interpolated Frames"
author = "mstan"
description = "Presents blended intermediate frames above the game's stock output. Game logic, timers, and audio remain at their original cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "frame-interpolation"
name = "Interpolated Frames"
description = "Blend between completed game frames at the selected output rate. Presentation only: gameplay and audio do not run faster."
group = "Display"
default_enabled = false

[[option]]
feature = "frame-interpolation"
id = "rate"
label = "Output rate"
description = "Display refresh follows the monitor; fixed choices pace presentation at the selected rate."
group = "Display"
type = "choice"
default = "display"

[[option.choice]]
value = "display"
label = "Display refresh"

[[option.choice]]
value = "90"
label = "90 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "240"
label = "240 FPS"

[[plugin]]
feature = "frame-interpolation"
id = "mmx4.frame-interpolation"
