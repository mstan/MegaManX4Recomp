format_version = 7
id = "mmx4.coop"
version = "0.0.1"
name = "X + Zero Co-op (Public Beta)"
author = "mstan"
description = "Simultaneous X and Zero public beta. Choose Unified or independent Split views."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "coop"
name = "X + Zero Co-op"
description = "Play together as X and Zero. Configure boss doors, boss battles, HUD and character codes below for local co-op or netplay. Requires OpenGL and a fresh boot."
group = "Experimental"
default_enabled = false

[[option]]
feature = "coop"
id = "cameras"
label = "Netplay cameras"
description = "Unified (default) shares a camera. Split gives each online player an independent view of the shared world. The host chooses for both peers. Local play uses the separate Local co-op display setting."
type = "choice"
default = "unified"
[[option.choice]]
value = "unified"
label = "Unified"
[[option.choice]]
value = "split"
label = "Split"

[[option]]
feature = "coop"
id = "stage_select_cast"
label = "Netplay stage select cast (Experimental)"
description = "Show both heroes and story companions on the stage menu. Off keeps the original screen. The host chooses for both peers. For local play, enable the separate Co-op Stage Select Cast mod instead. Requires a fresh boot."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "diagnostic_recording"
label = "Netplay diagnostic recording"
description = "Off by default. The host can enable input display and diagnostic traces on both peers for a bug report. Includes starting game saves; recordings are stored locally under saves/diagnostics. For local play, use Playtest Diagnostics. Requires a fresh boot."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "local_cameras"
label = "Local co-op display"
description = "Unified shares one screen. Side by side gives each local player a 4:3 camera and HUD, together in an 8:3 view. Independent pause menus show both character menus side by side in either local layout. Shared story scenes use one view. Requires a fresh boot; this setting does not change online cameras."
type = "choice"
default = "unified"
[[option.choice]]
value = "unified"
label = "Unified"
[[option.choice]]
value = "split"
label = "Side by side 8:3"

[[option]]
feature = "coop"
id = "hud_layout"
label = "HUD layout"
description = "Unified views stack the meters by default. Side by side restores the previous two-column layout. Split views keep only the local player's meter at its native position."
type = "choice"
default = "stacked"
[[option.choice]]
value = "stacked"
label = "Stacked"
[[option.choice]]
value = "side_by_side"
label = "Side by side"

[[option]]
feature = "coop"
id = "boss_doors"
label = "Boss doors and refight teleporters"
description = "Either player activates boss doors and fortress refight teleporters by default. Both players requires both living players to touch the same door or teleporter; a dead or teleported-out partner does not hold it closed. Works locally and online; the netplay host chooses for both players."
type = "choice"
default = "either"
[[option.choice]]
value = "either"
label = "Either player"
[[option.choice]]
value = "both"
label = "Both players"

[[plugin]]
feature = "coop"
id = "mmx4.coop"

# A private camera cannot use the one shared retail scrolling tile ring.
# Derive the authored-map renderer even when its standalone switch is off.
[[requirement]]
feature = "coop"
package = "mmx4.enhancement.widescreen"
requires_feature = "widescreen"
when = { local_cameras = "split" }

[[option]]
feature = "coop"
id = "simultaneous_menus"
label = "Independent pause menus"
description = "Either player opens both character menus. Each player manages their own weapons and E-tanks; either player resumes both. During tank use, the partner can keep managing their menu; gameplay resumes only after consumption finishes. Automatically requires separate E-tank contents, regardless of the setting below. W-tank energy remains shared. Local play shows both menus side by side; netplay shows your character's menu with either camera setting. On by default for every co-op mode. Requires a fresh boot; the netplay host chooses for both players."
type = "boolean"
default = "true"

[[option]]
feature = "coop"
id = "separate_etanks"
label = "Separate E-tanks with individual pausing"
description = "Independent pause menus always require separate E-tank contents. When Independent pause menus is off, this setting chooses separate or shared energy. Both players share tanks acquired by Player 1's campaign; pickups refill the collector's own energy when contents are separate. W-tanks stay shared. Requires a fresh boot; the netplay host chooses for both players."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "both_story_bosses"
label = "Fight Double and Iris"
description = "After your campaign's encounter, return to the boss door for the other fight before continuing the story. Works in local and online co-op; the netplay host chooses for both players."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "boss_scaling"
label = "Co-op boss scaling"
description = "Double effective boss health using the selected hit cooldown method, and reduce Zero's damage to bosses by 20%. Works in local and online co-op. Off preserves the original balance."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "boss_cooldowns"
label = "Boss hit cooldowns"
description = "With co-op boss scaling enabled, both methods halve boss hit cooldowns. Separate cooldowns let each player damage a boss independently, with short recovery for Zero's ground and aerial slashes and native attack contact checks. Reduced shared cooldowns uses one shared timer. The netplay host chooses for both players."
type = "choice"
default = "per_player"
[[option.choice]]
value = "per_player"
label = "Separate for each player"
[[option.choice]]
value = "shared"
label = "Reduced shared cooldowns"

[[option]]
feature = "coop"
id = "ultimate_armor_x"
label = "Ultimate Armor X code"
description = "Automatically enable X's native Ultimate Armor code for either player. A capsule still grants the armor. Works in local and online co-op, together with Black Zero."
type = "boolean"
default = false

[[option]]
feature = "coop"
id = "black_zero"
label = "Black Zero"
description = "Automatically use Zero's native black palette for either player. Works in local and online co-op, together with Ultimate Armor X."
type = "boolean"
default = false
