format_version = 7
id = "mmx4.coop-free-cutscenes"
version = "0.0.1"
name = "Co-op Free Movement During Cutscenes (Experimental)"
author = "mstan"
description = "An optional co-op experiment: the other players stay in the world and keep control during ordinary cutscenes. Doors and room transfers retain their existing behavior. Requires a fresh boot."
resolver = "declarative"
channel = "experimental"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "free-cutscenes"
name = "Keep moving during co-op cutscenes"
description = "Keep the other players visible and controllable during ordinary scenes in two-, three- or four-player co-op. Dialogue stays with the scene owner. Doors, portals and real room transfers retain their behavior. Enable a co-op mod separately."
group = "Experimental"
default_enabled = false

[[plugin]]
feature = "free-cutscenes"
id = "mmx4.coop-free-cutscenes"
