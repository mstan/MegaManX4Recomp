format_version = 5
id = "mmx4.diagnostics"
version = "1.0.0"
name = "Playtest Diagnostics"
author = "mstan"
description = "Records gameplay inputs with initial memory cards by default. The optional input display is independent."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "inputs"
name = "Input Recording"
description = "Writes inputs.csv and starting card copies beneath saves/diagnostics. Recording is independent of Input Display. For online play, use Netplay diagnostic recording under X + Zero Co-op."
group = "Diagnostics"
default_enabled = true

[[feature]]
id = "osd"
name = "Input Display"
description = "Shows P1/P2 buttons and an input counter during local play. Turning this off does not stop recording."
group = "Diagnostics"
default_enabled = false

[[plugin]]
feature = "inputs"
id = "mmx4.diagnostics"

[[plugin]]
feature = "osd"
id = "mmx4.diagnostics.osd"
